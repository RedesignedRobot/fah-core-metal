<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="fah-core-metal: a real Folding@home core on Apple Silicon GPUs. 21 of 21 state tests on a whole FAH unit, as FAH's core 0x27 passed. 101 of 101 core-parity checks." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>fah-core-metal: a real Folding@home core on Apple Silicon GPUs. 21 of 21 state tests on a whole FAH unit, as FAH's core 0x27 passed. 101 of 101 core-parity checks.</title>
<style>@font-face { font-family: InterCard; font-weight: 400; src: url('fonts/Inter-Regular.woff2'); } @font-face { font-family: InterCard; font-weight: 600; src: url('fonts/Inter-SemiBold.woff2'); } text { font-family: InterCard; }</style>
<rect x="0.0" y="0.0" width="1280.0" height="640.0" rx="0" fill="#0d1117"/>
<rect x="0.0" y="0.0" width="16.0" height="640.0" rx="0" fill="#4493f8"/>
<text x="80.0" y="170.0" font-size="96" fill="#e6edf3" text-anchor="start" font-weight="600">fah-core-metal</text>
<text x="80.0" y="240.0" font-size="40" fill="#9198a1" text-anchor="start" font-weight="normal">A real Folding@home core on Apple Silicon GPUs</text>
<rect x="80.0" y="300.0" width="550.0" height="220.0" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/>
<text x="116.0" y="400.0" font-size="80" fill="#4493f8" text-anchor="start" font-weight="600">21 of 21</text>
<text x="116.0" y="450.0" font-size="24" fill="#e6edf3" text-anchor="start" font-weight="normal">state tests passed on a whole FAH unit,</text>
<text x="116.0" y="482.0" font-size="24" fill="#e6edf3" text-anchor="start" font-weight="normal">as FAH's core 0x27 passed 21</text>
<rect x="650.0" y="300.0" width="550.0" height="220.0" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/>
<text x="686.0" y="400.0" font-size="80" fill="#4493f8" text-anchor="start" font-weight="600">101 of 101</text>
<text x="686.0" y="450.0" font-size="24" fill="#e6edf3" text-anchor="start" font-weight="normal">core-parity checks passed, on each path</text>
<text x="686.0" y="482.0" font-size="24" fill="#e6edf3" text-anchor="start" font-weight="normal">a FAH core has to survive</text>
<text x="80.0" y="590.0" font-size="24" fill="#9198a1" text-anchor="start" font-weight="normal">Force errors beside CUDA's. Three result files byte-identical to FAH's core's.</text>
</svg>
