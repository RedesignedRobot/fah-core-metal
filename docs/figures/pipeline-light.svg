<svg xmlns="http://www.w3.org/2000/svg" width="1044" height="156" viewBox="0 0 1044 156" role="img" aria-label="A FAH work unit goes into minicore, which runs it through OpenMM Metal with df64 mixed precision on the Apple GPU and writes FAH's result files, with the state tests" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
