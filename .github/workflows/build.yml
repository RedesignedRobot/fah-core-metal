# Build check for pull requests. GitHub's hosted Apple Silicon runners are virtual machines with no usable
# Metal GPU, so nothing here folds on Metal. The job builds minicore with build.sh as a Mac owner would,
# checks that the Metal platform is linked in (registering it needs no GPU) and that asking for the Apple GPU
# there exits GPU_UNAVAILABLE_ERROR, and folds the bundled test unit
# on OpenMM's CPU platform. That covers loading the unit, checkpoints and the result file. The state tests
# run too, but on CPU they compare CPU with itself, so they check the plumbing and not accuracy.
# Accuracy and speed on the GPU still come from runs on real Macs.
#
# The opencl-x86 job builds the opt-in x86_64 OpenCL core (MINICORE_ARCH=x86_64 MINICORE_OPENCL=1) on GitHub's Intel
# runners, logs each OpenCL device and uploads the core as an artifact for Intel Mac owners to run report.sh
# with. The runners' OpenCL lists only Apple's CPU device, which OpenMM skips and the core never folds on, so the
# client's arguments for an OpenCL GPU must exit 126 there. Nothing folds through OpenCL here: that covers the
# x86_64 build, the device table and the no-GPU exit, and nothing about an Intel or AMD GPU driver.
name: build

on:
  push:
    branches:
      - "test/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Both are arm64 runners with 3 M1 cores and 7 GB. macos-15 has Xcode 16.4 and the macOS 15 SDK,
        # the oldest toolchain build.sh accepts; macos-26 has Xcode 26.
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          cmake --version | head -n 1
          if command -v ninja > /dev/null; then echo "ninja $(ninja --version)"; fi

      - name: Build
        run: ./build.sh -j 3

      - name: Metal platform is linked in
        run: ./build/core/minicore --info | grep -w Metal

      # The runner's only Metal device is the VM's "Apple Paravirtual device", outside the Apple7 family, so the
      # client's Apple GPU arguments must end the fold at once with 126, as on a Mac with no usable GPU.
      - name: No usable Metal GPU exits 126
        run: |
          cp -R test/alanine-dipeptide no-gpu
          code=0
          ./build/core/minicore -dir no-gpu -gpu-vendor apple -gpu 0 || code=$?
          echo "exit $code"
          tail -n 2 no-gpu/logfile_01.txt
          if [ "$code" -ne 126 ]; then
            echo "::error::minicore exited $code, not 126 (GPU_UNAVAILABLE_ERROR)"
            exit 1
          fi

      # minicore's --platform CPU runs the whole unit on OpenMM's CPU platform. Its state tests compare CPU
      # with CPU, so this proves they run and report, not that they would catch a wrong force.
      - name: Fold the test unit on the CPU platform
        run: |
          cp -R test/alanine-dipeptide unit
          code=0
          ./build/core/minicore -dir unit --platform CPU || code=$?
          echo "exit $code"
          if [ "$code" -ne 100 ]; then
            echo "::error::minicore exited $code, not 100 (FINISHED_UNIT)"
            exit 1
          fi
          tar -xOf unit/wuresults_01.dat science.log > unit-science.log
          run=$(grep -c 'Running tests' unit-science.log || true)
          passed=$(grep -c 'All tests passed.' unit-science.log || true)
          echo "state tests: $run run, $passed passed"
          [ "$run" -gt 0 ] && [ "$run" -eq "$passed" ]

      - name: Log tail
        if: failure()
        run: tail -n 60 unit/logfile_01.txt || true

  opencl-x86:
    name: opencl x86_64 (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # GitHub's Intel macOS runners: 4 cores and 14 GB each.
        runner: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          cmake --version | head -n 1
          if command -v ninja > /dev/null; then echo "ninja $(ninja --version)"; fi

      - name: Build
        run: MINICORE_ARCH=x86_64 MINICORE_OPENCL=1 ./build.sh -j 4

      - name: Binary and OpenCL devices
        run: |
          lipo -info build/core/minicore
          otool -L build/core/minicore
          ./build/core/minicore --info | tee info.txt
          grep -w OpenCL info.txt > /dev/null
          tar -czf "minicore-x86_64-opencl-${{ matrix.runner }}.tar.gz" -C build core/minicore BUILD-INFO
          shasum -a 256 "minicore-x86_64-opencl-${{ matrix.runner }}.tar.gz" build/core/minicore

      # The tarball unpacks to core/minicore and BUILD-INFO, the layout ./report.sh <dir> reads.
      - name: Upload the core
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: minicore-x86_64-opencl-${{ matrix.runner }}.tar.gz
          archive: false
          if-no-files-found: error

      # The client's arguments for an OpenCL GPU, once with -opencl-device 0 (the CPU device's index on these
      # runners) and once with -gpu only: a Mac whose OpenCL lists no GPU must end the fold at once with 126
      # rather than run a GPU unit on the CPU.
      - name: No OpenCL GPU exits 126
        run: |
          if grep -q '^OpenCL device [0-9]*: .*, GPU, fp64' info.txt; then
            echo "::error::this runner lists an OpenCL GPU, so the no-GPU case can't be checked here"
            exit 1
          fi
          for run in opencl-device gpu-only; do
            cp -R test/alanine-dipeptide "no-gpu-$run"
            device="-opencl-device 0"
            [ "$run" = gpu-only ] && device=
            code=0
            ./build/core/minicore -dir "no-gpu-$run" -gpu-platform opencl -gpu-vendor amd -opencl-platform 0 $device -gpu 0 || code=$?
            echo "$run: exit $code"
            grep -e 'OpenCL' -e WARNING -e ERROR -e 'Shutdown' "no-gpu-$run/logfile_01.txt" || true
            if [ "$code" -ne 126 ]; then
              echo "::error::$run: minicore exited $code, not 126 (GPU_UNAVAILABLE_ERROR)"
              exit 1
            fi
          done
