name: Run report
description: You built minicore and folded the bundled test unit on your Mac. Post how it went.
title: "Run report: "
labels:
  - run-report
body:
  - type: markdown
    attributes:
      value: |
        Thanks for running it. A failure is as useful as a pass. The easy way: after `./build.sh`, run `./report.sh`. It folds the bundled test unit and prints every field below, then a link that opens this form with them filled in. To do it by hand, follow the README's [Try it](https://github.com/RedesignedRobot/fah-core-metal#try-it) section, then fill this in.

        **Paste only lines from the bundled test unit, `unit/` from `cp -R test/alanine-dipeptide unit`. Never paste a Folding@home work unit, your F@H ID or your passkey.** Don't paste the whole log either: its top lines hold your Mac's hostname and folder paths.

  - type: input
    id: chip
    attributes:
      label: Chip
      description: Apple menu > About This Mac.
      placeholder: M2, M4 Pro
    validations:
      required: true

  - type: input
    id: gpu-cores
    attributes:
      label: GPU cores
      description: System Information > Graphics/Displays, "Total Number of Cores".
      placeholder: "10"
    validations:
      required: true

  - type: input
    id: ram
    attributes:
      label: RAM
      description: Apple menu > About This Mac, "Memory".
      placeholder: 16 GB
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu > About This Mac.
      placeholder: "15.5"
    validations:
      required: true

  - type: textarea
    id: build
    attributes:
      label: Build
      description: |
        The last line `./build.sh` printed, which starts `minicore (fah-core-metal), OpenMM`. If the build failed, paste its last 20 lines instead.
      render: text
    validations:
      required: true

  - type: input
    id: exit-code
    attributes:
      label: Exit code
      description: |
        The number after `exit` that `./build/core/minicore -dir unit -gpu-vendor apple -gpu 0; echo "exit $?"` printed. 100 means FINISHED_UNIT.
      placeholder: "100"
    validations:
      required: true

  - type: textarea
    id: gpu-info
    attributes:
      label: GPU info lines
      description: The nine lines starting `GPU info:` in `unit/logfile_01.txt` (the first block is enough).
      render: text

  - type: textarea
    id: state-tests
    attributes:
      label: State tests
      description: |
        On a pass, the output of `tar -xOf unit/wuresults_01.dat science.log | grep -E 'Running tests|All tests passed'`. minicore runs a state test at every checkpoint, writes these lines to science.log inside the result, and exits 100 only if every one passed. On a failure, paste the end of `unit/logfile_01.txt` from the last `Completed ... steps` line, including any line starting `ERROR:` or `An exception occurred`.
      render: text

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else, such as how long the build took, what went wrong, or what you changed to get it working.

  - type: checkboxes
    id: test-unit-only
    attributes:
      label: Check
      options:
        - label: Everything above comes from the bundled test unit, nothing from a real Folding@home work unit or the FAH client.
          required: true
